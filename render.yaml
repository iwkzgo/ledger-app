services:
  - name: ledger-app
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ledger-db
    plan: free
    diskSizeGB: 1
