<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>{% block title %}가계부{% endblock %}</title>

<script>
  (function () {
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  })();
</script>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class" };

  function toggleTheme() {
    var isDark = document.documentElement.classList.toggle("dark");
    try {
      localStorage.setItem("theme", isDark ? "dark" : "light");
    } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", isDark ? "#1e1b4b" : "#4f46e5");
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}").catch(() => {});
    });
  }
</script>
</head>
<body class="min-h-screen bg-white text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-100">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-indigo-100 via-white to-white dark:from-slate-900 dark:via-slate-900 dark:to-slate-900"></div>
<div class="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-10">
    {% if current_user.is_authenticated %}
    <div class="mb-4 flex justify-end text-sm">
        <details class="group relative">
            <summary class="inline-flex cursor-pointer list-none items-center gap-1 rounded-full bg-white px-4 py-2 font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 hover:bg-slate-50 [&::-webkit-details-marker]:hidden dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-700">
                {{ current_user.username }}님
                <svg class="h-3.5 w-3.5 text-slate-400 transition-transform group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </summary>
            <div class="absolute right-0 z-10 mt-2 w-44 overflow-hidden rounded-xl bg-white text-left shadow-lg ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700">
                {% if current_user.username in config.ADMIN_USERNAMES %}
                <a href="{{ url_for('admin.users') }}" class="block px-4 py-2.5 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700">관리자</a>
                {% endif %}
                <a href="{{ url_for('auth.change_password') }}" class="block px-4 py-2.5 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700">비밀번호 변경</a>
                <button type="button" onclick="toggleTheme()" class="block w-full px-4 py-2.5 text-left text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700">🌙 다크모드</button>
                <form action="{{ url_for('auth.logout') }}" method="post">
                    <button type="submit" class="block w-full px-4 py-2.5 text-left text-rose-600 hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-500/10">로그아웃</button>
                </form>
            </div>
        </details>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
