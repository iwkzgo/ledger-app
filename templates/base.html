<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>{% block title %}가계부{% endblock %}</title>

<script>
  (function () {
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  })();
</script>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">

<style>
  *, *::before, *::after {
    transition-property: background-color, border-color, color, fill, stroke, box-shadow;
    transition-duration: 500ms;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class" };

  function toggleTheme() {
    var isDark = document.documentElement.classList.toggle("dark");
    try {
      localStorage.setItem("theme", isDark ? "dark" : "light");
    } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", isDark ? "#1e1b4b" : "#4f46e5");
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.error("서비스워커 등록 실패:", err));
    });
  }

  var deferredInstallPrompt = null;

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredInstallPrompt = event;
    var btn = document.getElementById("install-app-btn");
    if (btn) btn.style.display = "inline-flex";
  });

  window.addEventListener("appinstalled", function () {
    deferredInstallPrompt = null;
    var btn = document.getElementById("install-app-btn");
    if (btn) btn.style.display = "none";
  });

  function installApp() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function () {
      deferredInstallPrompt = null;
      var btn = document.getElementById("install-app-btn");
      if (btn) btn.style.display = "none";
    });
  }

  document.addEventListener("click", function (event) {
    var menu = document.getElementById("account-menu");
    if (menu && menu.open && !menu.contains(event.target)) {
      menu.open = false;
    }
  });
</script>
</head>
<body class="min-h-screen bg-white text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-100">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-indigo-100 via-white to-white dark:from-slate-900 dark:via-slate-900 dark:to-slate-900"></div>
<div class="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-10">
    {% if current_user.is_authenticated %}
    <div class="mb-4 flex items-center justify-end gap-2 text-sm">
        <button
            type="button"
            onclick="toggleTheme()"
            aria-label="화면 모드 전환"
            class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:ring-slate-700 dark:hover:bg-slate-700"
        >
            <svg class="h-4 w-4 text-slate-500 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 1020.354 15.354z" />
            </svg>
            <svg class="hidden h-4 w-4 text-amber-300 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.364 6.364l-1.06-1.06M6.697 6.697l-1.06-1.06m12.727 0l-1.06 1.06M6.697 17.303l-1.06 1.06M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
            </svg>
        </button>
        <details id="account-menu" class="group relative">
            <summary class="inline-flex cursor-pointer list-none items-center gap-1 rounded-full bg-white px-4 py-2 font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 hover:bg-slate-50 [&::-webkit-details-marker]:hidden dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-700">
                {{ current_user.username }}님
                <svg class="h-3.5 w-3.5 text-slate-400 transition-transform group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </summary>
            <div class="absolute right-0 z-10 mt-2 w-44 overflow-hidden rounded-xl bg-white text-left shadow-lg ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700">
                {% if current_user.username in config.ADMIN_USERNAMES %}
                <a href="{{ url_for('admin.users') }}" class="block px-4 py-2.5 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700">관리자</a>
                {% endif %}
                <a href="{{ url_for('ledger.categories_page') }}" class="block px-4 py-2.5 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700">카테고리 관리</a>
                <a href="{{ url_for('auth.change_password') }}" class="block px-4 py-2.5 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700">비밀번호 변경</a>
                <form action="{{ url_for('auth.logout') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="block w-full px-4 py-2.5 text-left text-rose-600 hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-500/10">로그아웃</button>
                </form>
            </div>
        </details>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    <div class="mt-10 flex justify-center">
        <button
            type="button"
            id="install-app-btn"
            onclick="installApp()"
            style="display: none"
            class="inline-flex items-center gap-2 rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-700"
        >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            앱 설치
        </button>
    </div>
</div>
</body>
</html>
