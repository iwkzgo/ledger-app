<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>{% block title %}가계부{% endblock %}</title>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}").catch(() => {});
    });
  }
</script>
</head>
<body class="min-h-screen bg-white text-slate-800 antialiased">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-indigo-100 via-white to-white"></div>
<div class="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-10">
    {% if current_user.is_authenticated %}
    <div class="mb-4 flex items-center justify-end gap-3 text-sm">
        {% if current_user.username in config.ADMIN_USERNAMES %}
        <a href="{{ url_for('admin.users') }}" class="font-semibold text-slate-500 hover:text-indigo-600">관리자</a>
        {% endif %}
        <span class="text-slate-500">{{ current_user.username }}님</span>
        <form action="{{ url_for('auth.logout') }}" method="post">
            <button type="submit" class="font-semibold text-slate-500 hover:text-rose-600">로그아웃</button>
        </form>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
