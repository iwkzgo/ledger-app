<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카테고리 확인</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>카테고리를 확인해주세요</h1>
    <p>규칙으로 자동 분류하지 못했습니다. 기억나지 않으면 "기타"로 두셔도 됩니다.</p>

    <table>
        <tbody>
            <tr><td>입력한 내용</td><td>{{ raw_text }}</td></tr>
            <tr><td>항목</td><td>{{ item }}</td></tr>
            <tr><td>금액</td><td>{{ "{:,}".format(amount) }}원</td></tr>
        </tbody>
    </table>

    <form action="{{ url_for('confirm_entry') }}" method="post">
        <input type="hidden" name="raw_text" value="{{ raw_text }}">
        <input type="hidden" name="item" value="{{ item }}">
        <input type="hidden" name="amount" value="{{ amount }}">
        <select name="category">
            {% for category in categories %}
            <option value="{{ category }}" {% if category == "기타" %}selected{% endif %}>{{ category }}</option>
            {% endfor %}
        </select>
        <button type="submit">저장</button>
    </form>
</div>
</body>
</html>
